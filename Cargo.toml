[package]
name = "hansb_me_3"
version = "0.1.0"
authors = ["Hans <hbhavan@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.42"
dioxus = { version = "0.7.2", features = ["router", "fullstack"] }
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive", "rc"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server" ]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
