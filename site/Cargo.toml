[package]
name = "site"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
dioxus = { version = "0.7.2", features = ["router", "fullstack"] }
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive", "rc"] }
writ = { path = "../writ" }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server" ]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
