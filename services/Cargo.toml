[package]
name = "services"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
postgres = { version = "0.19.12" }
sea-orm = { version = "2.0.0-rc", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros", "mock", "debug-print", "with-uuid", "schema-sync", "entity-registry"] } 
migration = { path = "../migration/" }
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
